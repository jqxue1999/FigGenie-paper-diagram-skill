  <title>quadrant-steps-skeleton-cross-rules-circled-captions-curved-arrows</title>
  <desc>layout skeleton of a four-step procedure: a thin horizontal and a thin vertical rule cross at the centre, a circled step caption sits in each quadrant (prepare, train, generate, train), a grey gradient block arrow goes down from step 1, curved black arrows sweep round the lower right and up to step 4, a straight arrow crosses the top | source: acl23-0057_fig1 (acl23-0057_fig1_p3_mixed.svg) | candidate wave1:quadrant-steps-skeleton-cross-rules-circled-captions-curved-arrows | units: pt at print size | colours as drawn, recolour by role</desc>

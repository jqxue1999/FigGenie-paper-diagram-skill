  <title>memory-pyramid-four-tiers-capacity-bandwidth</title>
  <desc>four stacked tiers widening downward with thick black outlines: a green triangle on top (Reg, 64 KB, 130 TB/s), a salmon trapezoid (Shared, 227 KB, 33 TB/s), an orange trapezoid (L2 Cache, 50 MB, 12 TB/s) and a teal trapezoid at the base (HBM, 80 GB, 3 TB/s) | source: iclr25-0270_fig1 (iclr25-0270_fig1_p2_mixed.svg) | candidate wave3:memory-pyramid-four-tiers-capacity-bandwidth | units: pt at print size | colours as drawn, recolour by role</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301.405 112.484" width="301.405pt" height="112.484pt" data-symbol="stacked-translucent-worker-layers-offset-in-depth-with-data-box-rows" data-kind="motif" data-size-pt="301.405x112.484">
  <title>stacked-translucent-worker-layers-offset-in-depth-with-data-box-rows</title>
  <desc>three grey panels stacked in depth, each offset up and to the right of the one in front and fainter than it, every panel with a row of data boxes (solid green outline = present, dashed outline = empty slot) and dotted ellipses, so N copies of the same pipeline read as N workers | source: cvpr25-0093_fig1 (cvpr25-0093_fig1_p4_vector.svg) | candidate wave1:stacked-translucent-worker-layers-offset-in-depth-with-data-box-rows | units: pt at print size | colours as drawn, recolour by role</desc>

  <title>times-n-transformer-stack-gold-new-block</title>
  <desc>a tall pale-yellow rounded container with a gold outline and an italic x N tag at its top right, holding from top to bottom a gold-outlined Cus-MOE box, a peach Norm and AdaLN box, a peach Self-Attention box and a second peach Norm and AdaLN box, a vertical stream line through them, circled plus residual junctions on the left fed by elbow lines, and a dotted side input (F0) to the lowest junction | source: acl25-0145_fig1 (acl25-0145_fig1_p3_mixed.svg) | candidate wave3:times-n-transformer-stack-gold-new-block | units: pt at print size | colours as drawn, recolour by role</desc>

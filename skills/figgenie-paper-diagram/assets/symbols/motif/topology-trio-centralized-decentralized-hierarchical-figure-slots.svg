  <title>topology-trio-centralized-decentralized-hierarchical-figure-slots</title>
  <desc>three tiny topologies drawn with small figure slots (grey boxes) joined by thin black arrows: a triangle with arrows both ways between three figures (centralized), one figure above two sides with spokes (decentralized), two figures above two with crossing diagonals (hierarchical), italic names above each and the bold green label Structure below | source: acl26-0041_fig1 (acl26-0041_fig1_p2_mixed.svg) | candidate wave1:topology-trio-centralized-decentralized-hierarchical-figure-slots | units: pt at print size | colours as drawn, recolour by role</desc>

  <title>vae-vs-tavae-two-rows-nested-old-encoder-in-mint-trapezoid</title>
  <desc>baseline and proposed model drawn as two rows of the same trapezoid chain: the VAE row above and the TAVAE row below, the unchanged pale-orange decoder keeping its colour, the encoder replaced by a mint trapezoid that holds a white rounded box with the old dark-orange encoder nested inside, labels q(z | x) and q_T(z | x) | source: iclr26-0239_fig1 (iclr26-0239_fig1_p4_mixed.svg) | candidate wave1:vae-vs-tavae-two-rows-nested-old-encoder-in-mint-trapezoid | units: pt at print size | colours as drawn, recolour by role</desc>

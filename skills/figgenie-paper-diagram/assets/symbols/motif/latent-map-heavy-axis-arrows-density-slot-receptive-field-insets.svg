  <title>latent-map-heavy-axis-arrows-density-slot-receptive-field-insets</title>
  <desc>square dark-purple density map of two latent dimensions with one yellow-green Gaussian blob, framed by two heavy black axis arrows without ticks, and a small receptive-field picture at the end of each axis (one at the top of the vertical axis, one at the right end of the horizontal axis) | source: iclr26-0239_fig1 (iclr26-0239_fig1_p4_mixed.svg) | candidate wave1:latent-map-heavy-axis-arrows-density-slot-receptive-field-insets | units: pt at print size | colours as drawn, recolour by role</desc>

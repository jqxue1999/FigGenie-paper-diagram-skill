  <title>cycle-ring-robot-wrench-two-green-arrows-loop</title>
  <desc>two green curved arrows forming a closed loop between a greyed robot-head slot at the top and a yellow disc with a greyed wrench slot at the bottom, the disc labelled RepARe in bold serif; orange and purple italic words (caption?, rationale?, two tennis players, position w.r.t net) sit inside and outside the loop | source: iclr24-0077_fig1 (iclr24-0077_fig1_p2_mixed.svg) | candidate wave3:cycle-ring-robot-wrench-two-green-arrows-loop | units: pt at print size | colours as drawn, recolour by role</desc>
